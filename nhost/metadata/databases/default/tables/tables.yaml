            schema: public
            name: workflow_runs
  select_permissions:
    - role: owner
      permission:
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
        columns: '*'
    - role: editor
      permission:
        filter:
          organization:
            org_members:
              user_id:
