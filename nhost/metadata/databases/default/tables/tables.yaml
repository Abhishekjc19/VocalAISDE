- table:
    schema: public
    name: organizations
  object_relationships:
    - name: monthly_usage
      using:
        manual_configuration:
          remote_table:
            schema: public
            name: org_monthly_usage
          column_mapping:
            id: org_id
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
  select_permissions:
    - role: owner
      permission:
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
        columns: '*'
    - role: editor
      permission:
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
        columns: '*'
    - role: viewer
      permission:
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
        columns: '*'
    - role: user
      permission:
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
        columns: '*'
  update_permissions:
    - role: owner
      permission:
        filter:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
        columns:
          - name
          - slug
          - quota_limit
        set: {}
  insert_permissions:
    - role: user
      permission:
        check: {}
        columns:
          - name
          - slug
- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  select_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _in: X-Hasura-Org-Ids
        columns: '*'
    - role: editor
      permission:
        filter:
          org_id:
            _in: X-Hasura-Org-Ids
        columns: '*'
    - role: viewer
      permission:
        filter:
          org_id:
            _in: X-Hasura-Org-Ids
        columns: '*'
    - role: user
      permission:
        filter:
          user_id:
            _eq: X-Hasura-User-Id
        columns: '*'
  insert_permissions:
    - role: owner
      permission:
        check:
          org_id:
            _in: X-Hasura-Org-Ids
        columns:
          - org_id
          - user_id
          - role
    - role: user
      permission:
        check:
          user_id:
            _eq: X-Hasura-User-Id
        columns:
          - org_id
          - user_id
          - role
  update_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _in: X-Hasura-Org-Ids
        columns:
          - role
  delete_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _in: X-Hasura-Org-Ids
