  update_permissions:
    - role: owner
      permission:
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
        columns:
          - name
          - description
          - is_active
    - role: editor
      permission:
        filter:
          organization:
            org_members:
