version: 3
sources:
  - name: default
    kind: postgres
    configuration:
      connection_info:
        database_url:
          from_env: HASURA_GRAPHQL_DATABASE_URL
    tables:
      # ---- organizations ----
      - table:
          schema: public
          name: organizations
        object_relationships:
          - name: monthly_usage
            using:
              manual_configuration:
                remote_table:
                  schema: public
                  name: org_monthly_usage
                column_mapping:
                  id: org_id
        array_relationships:
          - name: org_members
            using:
              foreign_key_constraint_on:
                column: org_id
                table:
                  schema: public
                  name: org_members
          - name: workflows
            using:
              foreign_key_constraint_on:
                column: org_id
                table:
                  schema: public
                  name: workflows
        select_permissions:
          - role: owner
            permission:
              filter:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
              columns: '*'
          - role: editor
            permission:
              filter:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
              columns: '*'
          - role: viewer
            permission:
              filter:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
              columns: '*'
          - role: user
            permission:
              filter:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
              columns: '*'
        update_permissions:
          - role: owner
            permission:
              filter:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner
              columns:
                - name
                - slug
                - quota_limit
              set: {}
        insert_permissions:
          - role: user
            permission:
              check: {}
              columns:
                - name
                - slug

      # ---- org_members ----
      - table:
          schema: public
          name: org_members
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
          - name: user
            using:
              foreign_key_constraint_on: user_id
        select_permissions:
          - role: owner
            permission:
              filter:
                org_id:
                  _in: X-Hasura-Org-Ids
              columns: '*'
          - role: editor
            permission:
              filter:
                org_id:
                  _in: X-Hasura-Org-Ids
              columns: '*'
          - role: viewer
            permission:
              filter:
                org_id:
                  _in: X-Hasura-Org-Ids
              columns: '*'
          - role: user
            permission:
              filter:
                user_id:
                  _eq: X-Hasura-User-Id
              columns: '*'
        insert_permissions:
          - role: owner
            permission:
              check:
                org_id:
                  _in: X-Hasura-Org-Ids
              columns:
                - org_id
                - user_id
                - role
          - role: user
            permission:
              check:
                user_id:
                  _eq: X-Hasura-User-Id
              columns:
                - org_id
                - user_id
                - role
        update_permissions:
          - role: owner
            permission:
              filter:
                org_id:
                  _in: X-Hasura-Org-Ids
              columns:
                - role
        delete_permissions:
          - role: owner
            permission:
              filter:
                org_id:
                  _in: X-Hasura-Org-Ids

      # ---- workflows ----
      - table:
          schema: public
          name: workflows
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
        array_relationships:
          - name: workflow_steps
            using:
              foreign_key_constraint_on:
                column: workflow_id
                table:
                  schema: public
                  name: workflow_steps
          - name: workflow_triggers
            using:
              foreign_key_constraint_on:
                column: workflow_id
                table:
                  schema: public
                  name: workflow_triggers
          - name: workflow_runs
            using:
              foreign_key_constraint_on:
                column: workflow_id
                table:
                  schema: public
                  name: workflow_runs
        select_permissions:
          - role: owner
            permission:
              filter:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
              columns: '*'
          - role: editor
            permission:
              filter:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
              columns: '*'
          - role: viewer
            permission:
              filter:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
              columns: '*'
          - role: user
            permission:
              filter:
                organization:
                  org_members:
                    user_id:
                      _eq: X-Hasura-User-Id
              columns: '*'
        insert_permissions:
          - role: owner
            permission:
              check:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in:
                            - owner
              columns:
                - org_id
                - name
                - description
                - is_active
              set:
                created_by: X-Hasura-User-Id
          - role: editor
            permission:
              check:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in:
                            - owner
                            - editor
              columns:
                - org_id
                - name
                - description
                - is_active
              set:
                created_by: X-Hasura-User-Id
          - role: user
            permission:
              check:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in:
                            - owner
                            - editor
              columns:
                - org_id
                - name
                - description
                - is_active
              set:
                created_by: X-Hasura-User-Id
        update_permissions:
          - role: owner
            permission:
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner
              columns:
                - name
                - description
                - is_active
          - role: editor
            permission:
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in:
                            - owner
                            - editor
              columns:
                - name
                - description
                - is_active
          - role: user
            permission:
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in:
                            - owner
                            - editor
              columns:
                - name
                - description
                - is_active
        delete_permissions:
          - role: owner
            permission:
              filter:
                organization:
                  org_members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner

      # ---- workflow_steps ----
      - table:
          schema: public
          name: workflow_steps
        object_relationships:
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id
        select_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: editor
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: viewer
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: user
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
        insert_permissions:
          - role: owner
            permission:
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
              columns:
                - workflow_id
                - step_order
                - name
                - step_type
                - config
          - role: editor
            permission:
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
              columns:
                - workflow_id
                - step_order
                - name
                - step_type
                - config
          - role: user
            permission:
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
              columns:
                - workflow_id
                - step_order
                - name
                - step_type
                - config
        update_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
              columns:
                - step_order
                - name
                - step_type
                - config
          - role: editor
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
              columns:
                - step_order
                - name
                - step_type
                - config
          - role: user
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
              columns:
                - step_order
                - name
                - step_type
                - config
        delete_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - role: editor
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
          - role: user
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor

      # ---- workflow_triggers ----
      - table:
          schema: public
          name: workflow_triggers
        object_relationships:
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id
        select_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: editor
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: viewer
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: user
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
        insert_permissions:
          - role: owner
            permission:
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
              columns:
                - workflow_id
                - trigger_type
                - config
                - is_active
          - role: editor
            permission:
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
              columns:
                - workflow_id
                - trigger_type
                - config
                - is_active
          - role: user
            permission:
              check:
                workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
              columns:
                - workflow_id
                - trigger_type
                - config
                - is_active

      # ---- workflow_runs ----
      - table:
          schema: public
          name: workflow_runs
        object_relationships:
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id
        array_relationships:
          - name: step_runs
            using:
              foreign_key_constraint_on:
                column: workflow_run_id
                table:
                  schema: public
                  name: step_runs
        select_permissions:
          - role: owner
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: editor
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: viewer
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'
          - role: user
            permission:
              filter:
                workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              columns: '*'

      # ---- step_runs ----
      - table:
          schema: public
          name: step_runs
        object_relationships:
          - name: workflow_run
            using:
              foreign_key_constraint_on: workflow_run_id
          - name: workflow_step
            using:
              foreign_key_constraint_on: workflow_step_id
        select_permissions:
          - role: owner
            permission:
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        user_id:
                          _eq: X-Hasura-User-Id
              columns: '*'
          - role: editor
            permission:
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        user_id:
                          _eq: X-Hasura-User-Id
              columns: '*'
          - role: viewer
            permission:
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        user_id:
                          _eq: X-Hasura-User-Id
              columns: '*'
          - role: user
            permission:
              filter:
                workflow_run:
                  workflow:
                    organization:
                      org_members:
                        user_id:
                          _eq: X-Hasura-User-Id
              columns: '*'

      # ---- watched_tables ----
      - table:
          schema: public
          name: watched_tables
        object_relationships:
          - name: organization
            using:
              foreign_key_constraint_on: org_id
          - name: workflow
            using:
              foreign_key_constraint_on: workflow_id

      # ---- org_monthly_usage (view) ----
      - table:
          schema: public
          name: org_monthly_usage
        select_permissions:
          - role: owner
            permission:
              filter: {}
              columns: '*'
          - role: editor
            permission:
              filter: {}
              columns: '*'
          - role: viewer
            permission:
              filter: {}
              columns: '*'
          - role: user
            permission:
              filter: {}
              columns: '*'

actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/trigger-run'
      timeout: 120
    permissions:
      - role: user
      - role: owner
      - role: editor
    comment: Triggers a workflow run with permission checks and quota enforcement
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/approve-step'
      timeout: 60
    permissions:
      - role: user
      - role: owner
      - role: editor
    comment: Approves a paused approval_gate step after role verification

custom_types:
  input_types:
    - name: TriggerWorkflowRunInput
      fields:
        - name: workflow_id
          type: uuid!
    - name: ApproveStepInput
      fields:
        - name: step_run_id
          type: uuid!
  object_types:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: success
          type: Boolean!
        - name: message
          type: String!
        - name: workflow_run_id
          type: uuid
